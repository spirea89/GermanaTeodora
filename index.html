<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Garden</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="game-panel" aria-labelledby="app-title">
        <header class="top-bar">
          <div>
            <p class="eyebrow">Writing practice</p>
            <h1 id="app-title">Word Garden</h1>
          </div>
          <button class="icon-button" id="settings-button" type="button" aria-label="Open word studio" title="Word studio">
            <span aria-hidden="true">⚙</span>
          </button>
        </header>

        <section class="score-row" aria-label="Game score">
          <div>
            <span class="score-label">Stars</span>
            <strong id="stars">0</strong>
          </div>
          <div>
            <span class="score-label">Streak</span>
            <strong id="streak">0</strong>
          </div>
          <div>
            <span class="score-label">Round</span>
            <strong id="round">1</strong>
          </div>
        </section>

        <section class="card game-card">
          <div class="clue-wrap" aria-live="polite">
            <span class="emoji-clue" id="emoji-clue" aria-hidden="true">🏠</span>
            <p class="phrase-clue" id="phrase-clue">A little home</p>
          </div>

          <div class="word-prompt" id="word-prompt" aria-label="Word with missing letters"></div>

          <label class="answer-label" for="answer-input">Type the missing letters</label>
          <div class="answer-row">
            <input id="answer-input" autocomplete="off" autocapitalize="none" spellcheck="false">
            <button id="check-button" type="button">Check</button>
          </div>

          <p class="hint" id="hint">Look at the picture and fill the middle.</p>
        </section>

        <section class="controls">
          <button class="ghost-button" id="speak-button" type="button">🔊 Hear word</button>
          <button class="ghost-button" id="skip-button" type="button">↪ New word</button>
        </section>
      </section>

      <aside class="studio-panel" id="studio-panel" aria-label="Word studio">
        <div class="studio-header">
          <div>
            <p class="eyebrow">Word studio</p>
            <h2>Practice list</h2>
          </div>
          <button class="icon-button" id="close-studio" type="button" aria-label="Close word studio" title="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <p class="studio-copy">One item per line. Add an emoji and clue with commas:</p>
        <pre>die Sonne, ☀️, Listen and fill the missing letters.</pre>
        <textarea id="word-list" rows="10"></textarea>
        <div class="studio-actions">
          <button id="save-words" type="button">Save words</button>
          <button class="ghost-button" id="reset-words" type="button">Reset</button>
        </div>
      </aside>
    </main>

    <div class="reward-layer" id="reward-layer" aria-live="assertive" aria-hidden="true">
      <div class="reward-card">
        <div class="reward-emoji" id="reward-emoji">🎉</div>
        <p id="reward-text">Brilliant!</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
